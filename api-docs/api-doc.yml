openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Merchant Verticals
  description: Platform-managed industry verticals available for merchant registration
- name: Voice
  description: Voice query processing for authenticated mobile clients
- name: Appointments
  description: Merchant-side calendar and appointment management
- name: Merchant Product Categories
  description: Manage merchant product categories
- name: Appearances
  description: Admin appearance history across a MOBILE merchant
- name: Appearances
  description: Discover currently active mobile merchant appearances
- name: Merchant Onboarding
  description: Endpoints for merchant onboarding and lifecycle
- name: Proximity
  description: Mobile geofence enter and exit event recording
- name: Admin Appointments
  description: Support-facing branch calendar and appointment override
- name: Employees
  description: Employee management for appointment booking
- name: Dashboard
  description: KPI dashboards for platform admins and merchant app users
- name: Invoices
  description: EU-standard ZUGFeRD / Factur-X invoice generation
- name: Payment Status
  description: Fallback query for authoritative payment status
- name: Device Registration
  description: Expo push token registration for payment status notifications
- name: Employee Availability
  description: Manage employee recurring availability and date-specific exceptions
- name: Settlement Reporting
  description: Payment settlement summary and transaction list for merchants and admins
- name: Actuator
  description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
- name: Merchant Location
  description: Geolocation and geofencing for merchants
- name: Merchant Search
  description: Full-text and filter-based merchant search
- name: Merchant Products
  description: Product catalog management for merchants
- name: Branch Opening Hours
  description: Manage branch recurring opening hours and date-specific exceptions
- name: User Management
  description: Manage Platform User assignments to Merchants and Branches
- name: Merchant Orders
  description: Create and list orders for authenticated merchant branches
- name: Appointments
  description: "Shopper appointment search, booking, history, cancellation, and rescheduling"
- name: Merchant Branches
  description: Manage branches under a merchant
- name: Merchant Provider Accounts
  description: Manage which Payment Service Providers are enabled for a merchant
- name: Geofence
  description: Geofence region discovery for mobile clients
- name: Appointment Policy
  description: Merchant-level appointment scheduling configuration
- name: Stripe Connect
  description: Stripe Connect Express account onboarding for merchants
- name: Appearances
  description: Manage scheduled location appearances for MOBILE merchants
- name: Orders
  description: Create and inspect orders for shoppers
paths:
  /{version}/shopper/appointments/{appointmentId}/reschedule:
    put:
      tags:
      - Appointments
      operationId: reschedule
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
  /{version}/merchants/{merchantId}/provider-accounts/{pspCode}:
    put:
      tags:
      - Merchant Provider Accounts
      summary: Enable a PSP for a merchant — creates the provider account record if
        it does not exist
      operationId: enable
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pspCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProviderAccountResponse"
    delete:
      tags:
      - Merchant Provider Accounts
      summary: Disable a PSP for a merchant — sets enabled=false without deleting
        the record
      operationId: disable
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pspCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/products/{productId}:
    get:
      tags:
      - Merchant Products
      summary: Get a single product
      operationId: get
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
    put:
      tags:
      - Merchant Products
      summary: "Update a product's name, price, and image"
      operationId: update
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                branchId:
                  type: string
                unitPrice:
                  type: string
                description:
                  $ref: "#/components/schemas/FormDescription"
                categoryId:
                  type: string
                productCode:
                  type: string
                image:
                  type: string
                  format: binary
              required:
              - branchId
              - name
              - unitPrice
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
    delete:
      tags:
      - Merchant Products
      summary: Soft-delete a product (sets active = false)
      operationId: deactivate
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/product-categories/{categoryId}:
    put:
      tags:
      - Merchant Product Categories
      summary: Update a product category
      operationId: update_1
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductCategoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductCategoryResponse"
    delete:
      tags:
      - Merchant Product Categories
      summary: Delete a product category
      operationId: delete
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/location:
    get:
      tags:
      - Merchant Location
      summary: Get a merchant's current location
      operationId: getLocation
      parameters:
      - name: merchantId
        in: path
