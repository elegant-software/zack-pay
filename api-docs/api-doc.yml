          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMerchantLocationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MerchantLocationResponse"
    delete:
      tags:
      - Merchant Location
      summary: Remove a merchant's location
      operationId: deleteLocation
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/employees/{employeeId}/name:
