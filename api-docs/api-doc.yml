openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
- oauth2: []
tags:
- name: Preparation stations
  description: Branch preparation station configuration and catalog routing
- name: Stripe Connect
  description: Stripe Connect account onboarding for merchants
- name: Tables
  description: "Tables, Floor Plans, Table Placements and live Table Status of a Branch"
- name: Storefront Orders
  description: Guest orders for the anonymous web storefront
- name: Merchant Verticals
  description: Platform-managed industry verticals available for merchant registration
- name: Voice
  description: Voice query processing for authenticated mobile clients
- name: Appointments
  description: Merchant-side calendar and appointment management
- name: Kitchen Screen
  description: Live Orders of one Branch and their Preparation Status
- name: Merchant Product Categories
  description: Manage merchant product categories
- name: Appearances
  description: Admin appearance history across a MOBILE merchant
- name: Appearances
  description: Discover currently active mobile merchant appearances
- name: Proximity
  description: Mobile geofence enter and exit event recording
- name: Storefront Payments
  description: Stripe payment for anonymous web storefront orders
- name: Admin Appointments
  description: Support-facing branch calendar and appointment override
- name: Employees
  description: Employee management for appointment booking
- name: Dashboard
  description: KPI dashboards for platform admins and merchant app users
- name: Kitchen Access
  description: "Enable, reset and disable the Kitchen Login of a Branch"
- name: Invoices
  description: EU-standard ZUGFeRD / Factur-X invoice generation
- name: Payment Status
  description: Fallback query for authoritative payment status
- name: Device Registration
  description: Expo push token registration for payment status notifications
- name: Employee Availability
  description: Manage employee recurring availability and date-specific exceptions
- name: Settlement Reporting
  description: Payment settlement summary and transaction list for merchants and admins
- name: Actuator
  description: Monitor and interact
  externalDocs:
    description: Spring Boot Actuator Web API Documentation
    url: https://docs.spring.io/spring-boot/docs/current/actuator-api/html/
- name: Merchant Location
  description: Geolocation and geofencing for merchants
- name: Merchant Search
  description: Full-text and filter-based merchant search
- name: Merchant Products
  description: Product catalog management for merchants
- name: Merchant Catalog Translations
  description: Product and category translations for the International Menu
- name: Kiosk
  description: "Kiosk sign-in and Kiosk Settings, called by the Kiosk device"
- name: Branch Opening Hours
  description: Manage branch recurring opening hours and date-specific exceptions
- name: User Management
  description: Manage Platform User assignments to Merchants and Branches
- name: Kiosk Access
  description: "Enable, reset and disable the Kiosk Login of a Branch and manage its\
    \ Kiosk Settings"
- name: Merchant Orders
  description: Create and list orders for authenticated merchant branches
- name: Appointments
  description: "Shopper appointment search, booking, history, cancellation, and rescheduling"
- name: Storefront Languages
  description: Public interface language metadata
- name: Merchant Branches
  description: Manage branches under a merchant
- name: Merchant Provider Accounts
  description: Manage which Payment Service Providers are enabled for a merchant
- name: Merchant Menu Languages
  description: Platform-managed languages a merchant catalogue can be offered in
- name: Merchant Catalog
  description: Branch-scoped catalog browsing for mobile apps
- name: Geofence
  description: Geofence region discovery for mobile clients
- name: Appointment Policy
  description: Merchant-level appointment scheduling configuration
- name: Merchants
  description: Endpoints for merchant management
- name: Storefront Tables
  description: Resolve a Table Link and show how many Tables are free
- name: Appearances
  description: Manage scheduled location appearances for MOBILE merchants
- name: Orders
  description: Create and inspect orders for shoppers
- name: Storefront Themes
  description: Named storefront looks merchants pick from; maintained by platform
    admins
- name: Shopper Profile
  description: Shopper invoice address — used automatically as Buyer Contact on orders
- name: Legal
  description: "Current Terms and Privacy Policy, per language"
paths:
  /{version}/storefront/themes/{code}:
    get:
      tags:
      - Storefront Themes
      summary: "Get one theme, including drafts, for storefront preview"
      operationId: get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StorefrontThemeResponse"
    put:
      tags:
      - Storefront Themes
      summary: Create or replace a draft theme (platform admin)
      operationId: save
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveStorefrontThemeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StorefrontThemeResponse"
  /{version}/shopper/profile:
    get:
      tags:
      - Shopper Profile
      summary: Get the authenticated shopper's invoice address
      operationId: get_1
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShopperProfileResponse"
    put:
      tags:
      - Shopper Profile
      summary: Create or update the authenticated shopper's invoice address
      operationId: upsert
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertShopperProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ShopperProfileResponse"
    delete:
      tags:
      - Shopper Profile
      summary: Delete the authenticated shopper's invoice address
      operationId: delete
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
  /{version}/shopper/appointments/{appointmentId}/reschedule:
    put:
      tags:
      - Appointments
      operationId: reschedule
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AppointmentResponse"
  /{version}/merchants/{merchantId}/provider-accounts/{pspCode}:
    put:
      tags:
      - Merchant Provider Accounts
      summary: Enable a PSP for a merchant — creates the provider account record if
        it does not exist
      operationId: enable
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pspCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProviderAccountResponse"
    delete:
      tags:
      - Merchant Provider Accounts
      summary: Disable a PSP for a merchant — sets enabled=false without deleting
        the record
      operationId: disable
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: pspCode
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/products/{productId}:
    get:
      tags:
      - Merchant Products
      summary: Get a single product
      operationId: get_2
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: language
        in: query
        required: false
        schema:
          type: string
      - name: Accept-Language
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
    put:
      tags:
      - Merchant Products
      summary: "Update a product's name, price, and image"
      operationId: update
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                branchId:
                  type: string
                unitPrice:
                  type: string
                description:
                  $ref: "#/components/schemas/FormDescription"
                categoryId:
                  type: string
                productCode:
                  type: string
                active:
                  type: string
                image:
                  type: string
                  format: binary
              required:
              - branchId
              - name
              - unitPrice
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductResponse"
    delete:
      tags:
      - Merchant Products
      summary: Soft-delete a product (sets active = false)
      operationId: deactivate
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/products/{productId}/translations/{language}:
    put:
      tags:
      - Merchant Catalog Translations
      summary: Create or replace a product translation as the merchant
      operationId: putProductTranslation
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: language
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCatalogTranslationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogTranslationResponse"
    delete:
      tags:
      - Merchant Catalog Translations
      summary: Delete a product translation
      operationId: deleteProductTranslation
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: language
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/product-categories/{categoryId}:
    put:
      tags:
      - Merchant Product Categories
      summary: Update a product category
      operationId: updateWithImage
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: removeImage
        in: query
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                category:
                  $ref: "#/components/schemas/UpdateProductCategoryRequest"
                image:
                  type: string
                  format: binary
              required:
              - category
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductCategoryRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductCategoryResponse"
    delete:
      tags:
      - Merchant Product Categories
      summary: Delete a product category
      operationId: delete_1
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/product-categories/{categoryId}/translations/{language}:
    put:
      tags:
      - Merchant Catalog Translations
      summary: Create or replace a product category translation as the merchant
      operationId: putCategoryTranslation
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: language
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertCatalogTranslationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CatalogTranslationResponse"
    delete:
      tags:
      - Merchant Catalog Translations
      summary: Delete a product category translation
      operationId: deleteCategoryTranslation
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: language
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/location:
    get:
      tags:
      - Merchant Location
      summary: Get a merchant's current location
      operationId: getLocation
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MerchantLocationResponse"
    put:
      tags:
      - Merchant Location
      summary: Set or update a merchant's location and geofence radius
      operationId: setLocation
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMerchantLocationRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/MerchantLocationResponse"
    delete:
      tags:
      - Merchant Location
      summary: Remove a merchant's location
      operationId: deleteLocation
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
  /{version}/merchants/{merchantId}/employees/{employeeId}/name:
    put:
      tags:
      - Employees
      operationId: rename
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameEmployeeRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
  /{version}/merchants/{merchantId}/employees/{employeeId}/deactivate:
    put:
      tags:
      - Employees
      operationId: deactivate_1
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
  /{version}/merchants/{merchantId}/employees/{employeeId}/activate:
    put:
      tags:
      - Employees
      operationId: activate
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: employeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
  /{version}/merchants/{merchantId}/branches/{branchId}:
    get:
      tags:
      - Merchant Branches
      summary: Get a branch by ID
      operationId: get_3
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BranchResponse"
    put:
      tags:
      - Merchant Branches
      summary: Update a branch under a merchant
      operationId: update_1
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBranchRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BranchResponse"
  /{version}/merchants/{merchantId}/branches/{branchId}/tables/{tableId}/placement:
    put:
      tags:
      - Tables
      summary: Place a Table on one of the Branch's Floor Plans; x and y are fractions
        (0..1) of the picture
      operationId: placeTable
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tableId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceTableRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableResponse"
    delete:
      tags:
      - Tables
      summary: Remove a Table from its Floor Plan
      operationId: unplaceTable
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tableId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableResponse"
  /{version}/merchants/{merchantId}/branches/{branchId}/tables/{tableId}/nfc-tag:
    put:
      tags:
      - Tables
      summary: Record that an NFC tag carrying the Table Link was written for this
        Table (now)
      operationId: recordNfcTag
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tableId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableResponse"
    delete:
      tags:
      - Tables
      summary: "Forget the Table's NFC tag, for example after it was lost"
      operationId: clearNfcTag
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tableId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableResponse"
  /{version}/merchants/{merchantId}/branches/{branchId}/tables/{tableId}/guests:
    put:
      tags:
      - Tables
      summary: Set a Table's Guest Count; on a free Table this makes it Occupied.
        Staff of the Branch only (403 for a Platform Admin)
      operationId: setGuestCount
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tableId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGuestCountRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TableLiveResponse"
  /{version}/merchants/{merchantId}/branches/{branchId}/preparation-configuration:
    get:
      tags:
      - Preparation stations
      summary: Get branch preparation stations and routing
      operationId: getPreparationConfiguration
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreparationConfiguration"
    put:
      tags:
      - Preparation stations
      summary: Replace branch preparation stations and routing
      operationId: savePreparationConfiguration
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreparationConfiguration"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PreparationConfiguration"
  /{version}/merchants/{merchantId}/branches/{branchId}/image:
    put:
      tags:
      - Merchant Branches
      summary: Set branch image
      operationId: setImage
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: branchId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBranchImageRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/BranchResponse"
  /{version}/merchants/{merchantId}/branches/{branchId}/floor-plans/{floorPlanId}/areas:
    put:
      tags:
      - Tables
      summary: Replace the Floor Areas traced over a Floor Plan; an empty list shows
        the picture again
      operationId: updateFloorAreas
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
