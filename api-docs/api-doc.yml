  /{version}/merchants/{merchantId}/employees/{employeeId}/deactivate:
    put:
      tags:
      - Employees
      operationId: deactivate_1
      parameters:
      - name: merchantId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: employeeId
