# =============================================================================
# Keycloak Ingress
# Route: ${AUTH_HOST} -> keycloak service (namespace: keycloak)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ${AUTH_HOST}
      secretName: ${TLS_SECRET_NAME}
  rules:
    - host: ${AUTH_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
---
# =============================================================================
# Backstage Ingress (via OAuth2 Proxy)
# Route: backstage.${BASE_DOMAIN} -> backstage-oauth2-proxy (namespace: backstage)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backstage
  namespace: backstage
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - backstage.${BASE_DOMAIN}
      secretName: ${TLS_SECRET_NAME}
  rules:
    - host: backstage.${BASE_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backstage-oauth2-proxy
                port:
                  number: 80
