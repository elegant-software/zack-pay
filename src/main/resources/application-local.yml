management:
  endpoints:
    web:
      exposure:
        include: info,metrics,health,prometheus
        exclude: env
      cors:
        allowed-origins: http://localhost:4200,http://localhost:4201,app://kitchen
        allowed-methods: GET

blitzpay:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:4201

logging:
  level:
    io.awspring.cloud: DEBUG
    liquibase: DEBUG
