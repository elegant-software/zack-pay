spring:
  cloud:
    aws:
      region:
        # Local startup must not depend on IDE dotenv loading or EC2 metadata.
        static: ${AWS_REGION:eu-central-1}

management:
  endpoints:
    web:
      exposure:
        include: metrics,health,prometheus
        exclude: env

blitzpay:
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://localhost:4201

logging:
  level:
    io.awspring.cloud: DEBUG
    liquibase: DEBUG
