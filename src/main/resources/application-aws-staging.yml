# AWS-only: Secrets Manager needs a region, which k8s pods don't have
spring:
  config:
    import:
      - optional:aws-secretsmanager:/zackpay/stripe
      - optional:aws-secretsmanager:/zackpay/braintree
      - optional:aws-secretsmanager:/zackpay/keycloak
      - optional:aws-secretsmanager:/zackpay/expo

management:
  endpoints:
    web:
      exposure:
        include: info,metrics,health,prometheus
        exclude: env

blitzpay:
  voice:
    whisper:
      base-url: http://whisper:8000/v1
