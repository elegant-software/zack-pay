spring:
  application:
    name: quickpay
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${KEYCLOAK_IAM_SERVER_URL:https://auth.zackpay.de}/realms/${KEYCLOAK_IAM_REALM:blitzpay}"
  profiles:
    default: local
  main:
    web-application-type: servlet
  reactor:
    context-propagation: auto
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quickpay_db}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 10
      auto-commit: true
      pool-name: HikariPool-1
      connection-init-sql: "SET search_path TO blitzpay, public"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate.connection.isolation: 2
      hibernate:
        default_schema: blitzpay
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: blitzpay
    liquibase-schema: public
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        enabled: true
        name: blitzpay-mcp
        version: 1.0.0
        protocol: STREAMABLE

management:
  observations:
    annotations:
      enabled: true
  metrics:
    tags:
      application: ${OTEL_SERVICE_NAME:${spring.application.name}}
      environment: ${OTEL_DEPLOYMENT_ENVIRONMENT:${spring.profiles.active:local}}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        blitzpay.external: true
        blitzpay.repository: true
  endpoints:
    web:
      exposure:
        include: metrics,health,prometheus
        exclude: env
  endpoint:
    metrics:
      enabled: true
    prometheus:
      access: read-only
  tracing:
    sampling:
      # Keep all spans until the collector applies error/latency/probabilistic tail sampling.
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      otlp:
        enabled: ${MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
      service.version: ${OTEL_SERVICE_VERSION:dev}
      deployment.environment.name: ${OTEL_DEPLOYMENT_ENVIRONMENT:${spring.profiles.active:local}}
      cloud.platform: ${OTEL_CLOUD_PLATFORM:local}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
          transport: ${OTEL_EXPORTER_OTLP_TRACES_TRANSPORT:http}
          timeout: ${OTEL_EXPORTER_OTLP_TRACES_TIMEOUT:10s}
springdoc:
  api-docs:
    path: /api-docs
  show-actuator: true
  swagger-ui:
    oauth:
      client-id: ${SWAGGER_OAUTH2_CLIENT_ID:blitzpay-api}
      use-pkce-with-authorization-code-grant: true
      scopes: openid profile
api:
  default-version: 1
  versions:
    invoice: 1
    qrpay: 1
    truelayer: 1
    payments: 1
    merchant: 1
    order: 1
    appointment: 1
    voice: 1
    reporting: 1

truelayer:
  enabled: ${TRUELAYER_ENABLED:false}
  webhookJku: ${TRUELAYER_WEBHOOK_JKU:http://localhost:8080/.well-known/jwks.json}
  # SDK configuration
  clientId: ${TRUELAYER_CLIENT_ID:}
  clientSecret: ${TRUELAYER_CLIENT_SECRET:}
  keyId: ${TRUELAYER_KEY_ID:}
  privateKeyPath: ${TRUELAYER_PRIVATE_KEY_PATH:}
  environment: ${TRUELAYER_ENV:sandbox}
  httpLogs: ${TRUELAYER_HTTP_LOGS:false}
  merchantAccountId: ${TRUELAYER_MERCHANT_ACCOUNT_ID:}
  webhooks:
    environment: sandbox
    maxSkew: PT60M

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  publishable-key: ${EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  connect-webhook-secret: ${STRIPE_CONNECT_WEBHOOK_SECRET:}
  dashboard-platform-account-id: ${STRIPE_DASHBOARD_PLATFORM_ACCOUNT_ID:}
  storefront-url: ${STOREFRONT_URL:http://localhost:4200}
  connect:
    return-url: ${STRIPE_CONNECT_RETURN_URL:}
    api-base-url: ${STRIPE_CONNECT_API_BASE_URL:http://localhost:8080}
    app-deep-link: ${STRIPE_CONNECT_APP_DEEP_LINK:}

braintree:
  merchant-id: ${BRAINTREE_MERCHANT_ID:}
  public-key: ${BRAINTREE_PUBLIC_KEY:}
  private-key: ${BRAINTREE_PRIVATE_KEY:}
  environment: ${BRAINTREE_ENVIRONMENT:sandbox}

blitzpay:
  openapi:
    primary-group-label: Invoice
    groups:
      invoice:
        label: Invoice
      qrpay:
        label: Payments - QRPay
      truelayer:
        label: Payments - TrueLayer
      support:
        label: Support
      general:
        label: Payments - General
      push-notifications:
        label: Payments - Push Notifications
      stripe:
        label: Payments - Stripe
      braintree:
        label: Payments - Braintree
      mobile-geofencing:
        label: Mobile-Geofencing
      merchant:
        label: Operations-Merchant
      order:
        label: Orders
      appointment:
        label: Appointments
      voice:
        label: Voice
      reporting:
        label: Reporting & Dashboards
      user-management:
        label: Operations-User Management
      actuator:
        label: Monitoring-Actuator
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:4200}
      - http://localhost:4200
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
  storage:
    bucket: ${STORAGE_BUCKET:blitzpay}
    internal-endpoint: ${STORAGE_INTERNAL_ENDPOINT:}
  product-image:
    quality:
      enabled: ${PRODUCT_IMAGE_QUALITY_ENABLED:true}
      min-short-edge: ${PRODUCT_IMAGE_MIN_SHORT_EDGE:400}
      max-aspect-ratio: ${PRODUCT_IMAGE_MAX_ASPECT_RATIO:4.0}
      min-sharpness: ${PRODUCT_IMAGE_MIN_SHARPNESS:40}
      min-brightness: ${PRODUCT_IMAGE_MIN_BRIGHTNESS:20}
      max-brightness: ${PRODUCT_IMAGE_MAX_BRIGHTNESS:250}
      min-contrast: ${PRODUCT_IMAGE_MIN_CONTRAST:10}
  google-maps:
    enabled: ${GOOGLE_MAPS_ENABLED:false}
    api-key: ${GOOGLE_MAPS_API_KEY:}
    base-url: ${GOOGLE_MAPS_BASE_URL:https://maps.googleapis.com}
    enrichment-interval-ms: ${GOOGLE_MAPS_ENRICHMENT_INTERVAL_MS:300000}
    batch-size: ${GOOGLE_MAPS_BATCH_SIZE:50}
  tables:
    # An Occupied Table is freed automatically when no order was placed at it for this long (ISO-8601 or 4h).
    auto-clear: ${TABLES_AUTO_CLEAR:4h}
    # Table Links are ${storefront-url}/t/{tableCode}; same host as the guest checkout redirects.
    storefront-url: ${STOREFRONT_URL:http://localhost:4200}
  geofence:
    proximity-cooldown-seconds: ${GEOFENCE_PROXIMITY_COOLDOWN_SECONDS:30}
    default-radius-meters: ${GEOFENCE_DEFAULT_RADIUS_METERS:500}
  expo:
    access-token: ${EXPO_ACCESS_TOKEN:}
    base-url: ${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
    receipts-url: ${EXPO_RECEIPTS_URL:https://exp.host/--/api/v2/push/getReceipts}
    request-timeout-ms: ${EXPO_TIMEOUT_MS:10000}
    max-batch-size: ${EXPO_MAX_BATCH:100}
    receipt-delay-minutes: ${EXPO_RECEIPT_DELAY_MIN:15}
  voice:
    enabled: ${VOICE_ENABLED:true}
    max-duration-seconds: ${VOICE_MAX_DURATION_SECONDS:60}
    max-upload-bytes: ${VOICE_MAX_UPLOAD_BYTES:26214400}
    request-timeout-ms: ${VOICE_REQUEST_TIMEOUT_MS:60000}
    accepted-content-types:
      - audio/mpeg
      - audio/mp4
      - audio/webm
      - audio/wav
      - audio/ogg
      - audio/m4a
    whisper:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${WHISPER_BASE_URL:http://localhost:8000/v1}
      model: ${WHISPER_MODEL:whisper-1}

keycloak:
  iam:
    server-url: ${KEYCLOAK_IAM_SERVER_URL:https://auth.zackpay.de}
    realm: ${KEYCLOAK_IAM_REALM:blitzpay}
    admin-client-id: ${KEYCLOAK_IAM_ADMIN_CLIENT_ID:}
    admin-client-secret: ${KEYCLOAK_IAM_ADMIN_CLIENT_SECRET:}
    kitchen:
      client-id: ${KEYCLOAK_IAM_KITCHEN_CLIENT_ID:blitzpay-kitchen}
      redirect-uri: ${KEYCLOAK_IAM_KITCHEN_REDIRECT_URI:app://kitchen/renderer/index.html}
      api-base-url: ${API_BASE_URL:${STRIPE_CONNECT_API_BASE_URL:http://localhost:8080}}
