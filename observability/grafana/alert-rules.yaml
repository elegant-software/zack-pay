apiVersion: 1

groups:
  - orgId: 1
    name: blitz-pay-api
    folder: BlitzPay
    interval: 1m
    rules:
      - uid: blitz-pay-high-5xx
        title: BlitzPay API 5xx rate above 5%
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: BlitzPay has returned more than 5% server errors for five minutes.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(http_server_requests_seconds_count{application="blitz-pay",status=~"5.."}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{application="blitz-pay"}[5m])), 0.001)'
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator: {params: [0.05], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
      - uid: blitz-pay-high-p95
        title: BlitzPay API p95 latency above 1 second
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        annotations:
          summary: BlitzPay p95 server latency has exceeded one second for ten minutes.
        labels:
          severity: warning
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: 'histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="blitz-pay"}[5m])))'
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A
              type: threshold
              conditions:
                - evaluator: {params: [1], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
