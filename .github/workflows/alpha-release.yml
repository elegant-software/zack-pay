name: Alpha release (draft)

run-name: "Alpha release from ${{ github.ref_name }}"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alpha-release:
    name: Create draft alpha release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute alpha version
        id: version
        run: |
          latest=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          latest=${latest:-v0.0.0}
          IFS='.' read -r major minor patch <<< "${latest#v}"
          next_patch=$((patch + 1))
          branch=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g' | cut -c1-30)
          echo "tag=v${major}.${minor}.${next_patch}-alpha.${branch}" >> "$GITHUB_OUTPUT"
          echo "base=${latest}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: notes
        run: |
          base=${{ steps.version.outputs.base }}
          notes=$(git log ${base}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "Alpha release from branch \`${{ github.ref_name }}\` — not for production." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "### Changes since ${base}" >> "$GITHUB_OUTPUT"
          echo "${notes}" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create draft alpha release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "${{ steps.notes.outputs.notes }}" \
            --draft \
            --prerelease \
            --target "${{ github.ref_name }}"
