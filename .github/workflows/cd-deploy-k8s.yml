name: CD · Deploy to Kubernetes
run-name: Deploy ${{ inputs.image-tag }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Docker image tag to deploy (e.g. v0.2.2). "latest" resolves to the latest published release tag.'
        required: false
        type: string
        default: latest
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    name: Deploy ${{ inputs.image-tag }} to ${{ inputs.environment }}
    runs-on: self-hosted
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      APP_NAME: ${{ vars.APP_NAME }}
      HELM_CHART: ./helm/${{ vars.APP_NAME }}
      ENV_SUFFIX: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
      OTLP_LOGS_ENDPOINT: ${{ vars.OTLP_LOGS_ENDPOINT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve image tag
        env:
          INPUT_TAG: ${{ inputs.image-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$INPUT_TAG"
          if [ -z "$tag" ] || [ "$tag" = "latest" ]; then
            tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r '.tag_name // empty')
            if [ -z "$tag" ]; then
              echo "::error::Could not resolve the latest release tag"
              exit 1
            fi
            echo "::notice title=Resolved image tag::latest → $tag"
          fi
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Configure kubectl
        env:
          K8S_SERVER: ${{ secrets.K8S_SERVER }}
          K8S_CA_CERT: ${{ secrets.K8S_CA_CERT }}
          K8S_TOKEN: ${{ secrets.K8S_TOKEN }}
        run: |
          missing=()
          [ -z "$K8S_SERVER" ]  && missing+=("K8S_SERVER")
          [ -z "$K8S_CA_CERT" ] && missing+=("K8S_CA_CERT")
          [ -z "$K8S_TOKEN" ]   && missing+=("K8S_TOKEN")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          echo "$K8S_CA_CERT" | base64 -d > "$HOME/.kube/ca.crt"

          kubectl config set-cluster deploy-cluster \
            --server="$K8S_SERVER" \
            --certificate-authority="$HOME/.kube/ca.crt" \
            --tls-server-name=kubernetes \
            --embed-certs=true

          kubectl config set-credentials deploy-user \
            --token="$K8S_TOKEN"

          kubectl config set-context deploy-context \
            --cluster=deploy-cluster \
            --user=deploy-user

          kubectl config use-context deploy-context

      - name: Verify cluster connectivity
        run: kubectl cluster-info --request-timeout=10s

      - name: Deploy to ${{ inputs.environment }}
        run: |
          HELM_ARGS=(
            --namespace blitzpay-$ENV_SUFFIX
            --create-namespace
            --values $HELM_CHART/values.yaml
            --values $HELM_CHART/values-$ENV_SUFFIX.yaml
            --set image.tag=$IMAGE_TAG
            --wait
            --atomic
            --timeout 10m
          )

          # Allow environment-specific OTLP endpoint from GitHub Environment Variables.
          if [ -n "${OTLP_LOGS_ENDPOINT:-}" ]; then
            HELM_ARGS+=(--set-string config.otlpLogsEndpoint="$OTLP_LOGS_ENDPOINT")
          fi

          helm upgrade --install $APP_NAME $HELM_CHART "${HELM_ARGS[@]}"

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/$APP_NAME \
            --namespace blitzpay-$ENV_SUFFIX \
            --timeout=10m

      - name: Add deployment to job summary
        if: always()
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          JOB_STATUS: ${{ job.status }}
        run: |
          revision=$(helm history "$APP_NAME" --namespace "blitzpay-$ENV_SUFFIX" --max 1 -o json 2>/dev/null | jq -r '.[0].revision // empty')
          revision=${revision:-—}
          IMAGE_TAG=${IMAGE_TAG:-unresolved}
          if [ "$JOB_STATUS" = "success" ]; then icon="🚀"; result="✅ rolled out"; else icon="❌"; result="❌ ${JOB_STATUS}"; fi
          {
            echo "### ${icon} Deploy \`${IMAGE_TAG}\` to ${ENVIRONMENT}"
            echo "| Release | Namespace | Image tag | Helm revision | Result |"
            echo "|---|---|---|---|---|"
            echo "| ${APP_NAME} | blitzpay-${ENV_SUFFIX} | \`${IMAGE_TAG}\` | ${revision} | ${result} |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Deploy ${JOB_STATUS}::${APP_NAME} ${IMAGE_TAG} → blitzpay-${ENV_SUFFIX} (revision ${revision})"
