name: Docs · Module Design (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'src/main/**'
      - 'src/test/kotlin/com/elegant/software/blitzpay/ArchitectureSiteTest.kt'
      - '*.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/architecture-docs.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Generate module design site
        run: ./gradlew test --tests "com.elegant.software.blitzpay.ArchitectureSiteTest" --no-daemon
        env:
          ORG_GRADLE_PROJECT_javaVersion: ${{ vars.JAVA_VERSION }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/architecture-site
      - id: deploy
        uses: actions/deploy-pages@v4
