name: CD pipeline
run-name: Release build ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Alpha release tag to deploy
        required: true
        type: string
  release:
    types:
      - published
      - prereleased
      - edited


jobs:
  ci:
    name: CI for release ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
    permissions:
      actions: write
      contents: write
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci.yml
  release:
    name: Release build ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      checks: write
    #needs: ci
    if: github.event_name == 'release' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: elegant-software/elegant-ci-cd-pipeline/.github/workflows/backend-docker-build.yml@main
    with:
      java-version: ${{ vars.JAVA_VERSION }}
      image-name: ${{ vars.APP_NAME }}
      image-tag: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
      registry: ${{ vars.CONTAINER_REGISTRY }}
