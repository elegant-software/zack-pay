name: Deploy to ECS Fargate
run-name: Deploy ${{ inputs.image-tag }} to Fargate

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Docker image tag to deploy (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECS_CLUSTER: zackpay
  ECR_REPOSITORY: zackpay
  CONTAINER_NAME: App

jobs:
  deploy:
    name: Deploy ${{ inputs.image-tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Discover ECS service name
        id: svc
        run: |
          SERVICE_ARNS=$(aws ecs list-services --cluster "$ECS_CLUSTER" --query 'serviceArns[]' --output text)

          for SERVICE_ARN in $SERVICE_ARNS; do
            TASK_DEF_ARN=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$SERVICE_ARN" \
              --query 'services[0].taskDefinition' \
              --output text)

            if aws ecs describe-task-definition \
              --task-definition "$TASK_DEF_ARN" \
              --query "taskDefinition.containerDefinitions[?name=='$CONTAINER_NAME'].name" \
              --output text | grep -qx "$CONTAINER_NAME"; then
              SERVICE=$(echo "$SERVICE_ARN" | awk -F/ '{print $NF}')
              echo "name=$SERVICE" >> "$GITHUB_OUTPUT"
              echo "Service: $SERVICE"
              exit 0
            fi
          done

          echo "No ECS service in cluster '$ECS_CLUSTER' uses a task definition with container '$CONTAINER_NAME'." >&2
          echo "Deploy the CDK app stack first so the application ECS service exists: cd infra && npm run cdk -- deploy ZackPayApp" >&2
          echo "Available services and container names:" >&2
          for SERVICE_ARN in $SERVICE_ARNS; do
            TASK_DEF_ARN=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" \
              --services "$SERVICE_ARN" \
              --query 'services[0].taskDefinition' \
              --output text)
            CONTAINERS=$(aws ecs describe-task-definition \
              --task-definition "$TASK_DEF_ARN" \
              --query 'taskDefinition.containerDefinitions[].name' \
              --output text)
            echo "  $SERVICE_ARN: $CONTAINERS" >&2
          done
          exit 1

      - name: Download current task definition
        id: taskdef
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "${{ steps.svc.outputs.name }}" \
            --query 'services[0].taskDefinition' --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > task-definition.json

          echo "family=$(jq -r .family task-definition.json)" >> "$GITHUB_OUTPUT"

      - name: Update image in task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image-tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ steps.svc.outputs.name }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 30
