name: Deploy to ECS Fargate
run-name: Deploy ${{ inputs.image-tag }} to Fargate

on:
  workflow_dispatch:
    inputs:
      image-tag:
        description: 'Docker image tag to deploy (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECS_CLUSTER: zackpay
  ECR_REPOSITORY: zackpay
  CONTAINER_NAME: App

jobs:
  deploy:
    name: Deploy ${{ inputs.image-tag }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Discover ECS service name
        id: svc
        run: |
          SERVICE=$(aws ecs list-services --cluster "$ECS_CLUSTER" --query 'serviceArns[0]' --output text | awk -F/ '{print $NF}')
          echo "name=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "Service: $SERVICE"

      - name: Download current task definition
        id: taskdef
        run: |
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "${{ steps.svc.outputs.name }}" \
            --query 'services[0].taskDefinition' --output text)

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            | jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            > task-definition.json

          echo "family=$(jq -r .family task-definition.json)" >> "$GITHUB_OUTPUT"

      - name: Update image in task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ inputs.image-tag }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ steps.svc.outputs.name }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
