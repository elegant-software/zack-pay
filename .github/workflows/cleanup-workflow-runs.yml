name: Cleanup · Workflow Runs

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      older_than_days:
        description: "Delete workflow runs older than this many days"
        required: true
        default: "14"
      dry_run:
        description: "Dry run only"
        required: true
        default: "true"

jobs:
  cleanup:
    name: Delete Old Workflow Runs
    permissions:
      actions: write
      contents: write
    uses: elegant-software/elegant-ci-cd-pipeline/.github/workflows/cleanup-github-workflows.yml@main
    with:
        older_than_days: ${{ fromJSON(inputs.older_than_days || '14') }}
        dry_run: ${{ fromJSON(inputs.dry_run || 'true') }}