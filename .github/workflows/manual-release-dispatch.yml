name: Manual release

run-name: "Release ${{ inputs.new_version || '(version TBD)' }} from ${{ inputs.base_branch }}"

on:
  workflow_dispatch:
    inputs:
      new_version:
        description: 'Version being released (e.g. v1.3.0). Used in job name only.'
        required: false
        type: string
        default: ''
      release_boundary:
        description: 'Tag to diff from (e.g. v1.2.3). Leave blank to use latest tag.'
        required: false
        type: string
        default: ''
      base_branch:
        description: 'Branch to check for changes after the release boundary'
        required: false
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: manual-release-${{ inputs.base_branch }}
  cancel-in-progress: false

jobs:
  manual-release:
    name: "Release ${{ inputs.new_version || '(version TBD)' }}"
    permissions:
      contents: write
    uses: elegant-software/elegant-ci-cd-pipeline/.github/workflows/manual-release.yml@main
    with:
      release_boundary: ${{ inputs.release_boundary }}
      base_branch: ${{ inputs.base_branch }}
      automation_ref: main
      version_suffix: ${{ inputs.base_branch != 'main' && '-alpha' || '' }}
      prerelease: ${{ inputs.base_branch != 'main' }}
    secrets:
      RELEASE_PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
      AUTOMATION_READ_TOKEN: ${{ secrets.AUTOMATION_READ_TOKEN }}
