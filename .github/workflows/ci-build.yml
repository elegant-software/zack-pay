name: CI · Build & Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:
    inputs:
      gradle-args:
        required: false
        type: string
        default: ""
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
env:
  ORG_GRADLE_PROJECT_javaVersion: ${{ vars.JAVA_VERSION }}
permissions:
  contents: read
  actions: write
  checks: write
jobs:
  # Builds and tests only run when code or build config changed. The workflow itself
  # always runs, so skipped jobs still report success. Non push/PR events (e.g. the
  # release build calling this workflow) always run everything.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ (github.event_name != 'push' && github.event_name != 'pull_request') || steps.filter.outputs.code == 'true' }}
      jooq: ${{ (github.event_name != 'push' && github.event_name != 'pull_request') || steps.filter.outputs.jooq == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            build: &build
              - '*.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew'
              - '.github/workflows/ci-build.yml'
            code:
              - *build
              - 'src/**'
            jooq:
              - *build
              - 'src/main/resources/db/**'
              - 'src/jooq/**'
              - 'src/jooqCodegen/**'
              - 'src/generated/jooq/**'

  test:
    name: Tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      actions: write
      checks: write
    uses: elegant-software/elegant-ci-cd-pipeline/.github/workflows/backend-gradle-test.yml@main
    with:
      gradle-args: ${{ inputs.gradle-args }}
      unit-test-task: test
      integration-test-task: help

  jooq-check:
    name: jOOQ Sources Up To Date
    needs: changes
    if: needs.changes.outputs.jooq == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ vars.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
      - name: Regenerate jOOQ sources from Liquibase schema
        run: ./gradlew generateJooq --no-daemon
      - name: Fail if committed sources are stale
        run: |
          git add -N src/generated/jooq
          git diff --exit-code -- src/generated/jooq || {
            echo "::error::src/generated/jooq is out of date. Run './gradlew generateJooq' and commit the result."
            exit 1
          }

  qodana:
    name: Qodana
    needs: test
    if: false # temporarily disabled to verify watchdog functionality and codana docker issue
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: write
    uses: elegant-software/elegant-ci-cd-pipeline/.github/workflows/backend-qa-qodana-code-quality.yml@main
    secrets: inherit

  sbom-upload:
    name: SBOM
    needs: test
    if: false # temporarily disabled to verify watchdog functionality
    permissions:
      actions: write
      contents: read
    uses: elegant-software/elegant-ci-cd-pipeline/.github/workflows/backnd-qa-dependency-track-upload.yml@main
    secrets: inherit
