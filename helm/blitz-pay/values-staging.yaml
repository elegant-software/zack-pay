# Staging environment overrides.
# Apply with: helm upgrade --install ... -f values.yaml -f values-staging.yaml

replicaCount: 1

image:
  pullSecrets:
    - ghcr-pull-secret

ingress:
  hostname: api-blitzpay-staging.zackpay.de
  tlsSecretName: wildcard-zackpay-de-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"

config:
  springProfilesActive: staging
  tracingEnabled: "true"
  frontendOrigin: https://blitzpay-admin-dashboard.zackpay.de
  truelayerApiBase: https://api.truelayer-sandbox.com
  truelayerEnv: sandbox
  truelayerHttpLogs: "true"
  truelayerWebhookJku: https://api.staging.blitz-pay.com/.well-known/jwks.json
  whisperBaseUrl: http://whisper:8000/v1
  stripeConnectReturnUrl: https://api-blitzpay-staging.zackpay.de/stripe-connect/return
  stripeConnectApiBaseUrl: https://api-blitzpay-staging.zackpay.de
  stripeConnectAppDeepLink: ""
