{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "blitz-pay.fullname" . }}
  labels:
    {{- include "blitz-pay.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- $host := .Values.ingress.hostname | default (include "blitz-pay.host" (list . "api")) }}
spec:
  ingressClassName: {{ .Values.ingress.ingressClassName }}
  tls:
    - hosts:
        - {{ $host | quote }}
      secretName: {{ include "blitz-pay.tlsSecretName" . | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /api-docs
            pathType: Prefix
            backend:
              service:
                name: {{ include "blitz-pay.fullname" . }}
                port:
                  number: 9000
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: {{ include "blitz-pay.fullname" . }}
                port:
                  number: 9000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "blitz-pay.fullname" . }}
                port:
                  number: 9000
{{- end }}
