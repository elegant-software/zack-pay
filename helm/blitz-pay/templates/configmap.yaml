apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "blitz-pay.fullname" . }}-config
  labels:
    {{- include "blitz-pay.labels" . | nindent 4 }}
data:
  SPRING_PROFILES_ACTIVE: {{ .Values.config.springProfilesActive | quote }}
  OTLP_LOGS_ENDPOINT: {{ .Values.config.otlpLogsEndpoint | quote }}
  MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED: {{ .Values.config.tracingEnabled | quote }}
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: {{ .Values.config.otlpTracesEndpoint | quote }}
  OTEL_EXPORTER_OTLP_TRACES_TRANSPORT: {{ .Values.config.otlpTracesTransport | quote }}
  OTEL_EXPORTER_OTLP_TRACES_TIMEOUT: {{ .Values.config.otlpTracesTimeout | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.otelServiceName | quote }}
  OTEL_SERVICE_VERSION: {{ .Values.config.otelServiceVersion | default (.Values.image.tag | default .Chart.AppVersion) | quote }}
  OTEL_DEPLOYMENT_ENVIRONMENT: {{ .Values.config.springProfilesActive | quote }}
  OTEL_CLOUD_PLATFORM: {{ .Values.config.otelCloudPlatform | quote }}
  TRUELAYER_API_BASE: {{ .Values.config.truelayerApiBase | quote }}
  TRUELAYER_ENV: {{ .Values.config.truelayerEnv | quote }}
  TRUELAYER_HTTP_LOGS: {{ .Values.config.truelayerHttpLogs | quote }}
  TRUELAYER_WEBHOOK_JKU: {{ .Values.config.truelayerWebhookJku | quote }}
  # Not sensitive — just the in-container path to the mounted PEM file.
  # The actual PEM content is in the blitz-pay-truelayer-pem Secret (volume mount).
  TRUELAYER_PRIVATE_KEY_PATH: {{ printf "%s/%s" .Values.privateKey.mountPath .Values.privateKey.secretKey | quote }}
  WHISPER_BASE_URL: {{ .Values.config.whisperBaseUrl | quote }}
  {{- with .Values.config.storageInternalEndpoint }}
  STORAGE_INTERNAL_ENDPOINT: {{ . | quote }}
  {{- end }}
  {{- if .Values.global.baseDomain }}
  {{- $api := printf "https://%s" (include "blitz-pay.host" (list . "api")) }}
  FRONTEND_ORIGIN: {{ .Values.config.frontendOrigin | default (printf "https://%s" (include "blitz-pay.host" (list . "admin"))) | quote }}
  STRIPE_CONNECT_RETURN_URL: {{ .Values.config.stripeConnectReturnUrl | default (printf "%s/stripe-connect/return" $api) | quote }}
  STRIPE_CONNECT_API_BASE_URL: {{ .Values.config.stripeConnectApiBaseUrl | default $api | quote }}
  STOREFRONT_URL: {{ printf "https://%s" (include "blitz-pay.host" (list . "storefront")) | quote }}
  KEYCLOAK_IAM_SERVER_URL: {{ printf "https://%s" (include "blitz-pay.host" (list . "auth")) | quote }}
  STORAGE_ENDPOINT: {{ printf "https://%s" (include "blitz-pay.host" (list . "minio")) | quote }}
  {{- else }}
  FRONTEND_ORIGIN: {{ .Values.config.frontendOrigin | quote }}
  STRIPE_CONNECT_RETURN_URL: {{ .Values.config.stripeConnectReturnUrl | quote }}
  STRIPE_CONNECT_API_BASE_URL: {{ .Values.config.stripeConnectApiBaseUrl | quote }}
  STOREFRONT_URL: {{ .Values.config.storefrontUrl | default "" | quote }}
  {{- end }}
  STRIPE_CONNECT_APP_DEEP_LINK: {{ .Values.config.stripeConnectAppDeepLink | quote }}
  STRIPE_DASHBOARD_PLATFORM_ACCOUNT_ID: {{ .Values.config.stripeDashboardPlatformAccountId | quote }}
